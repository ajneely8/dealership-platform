# Local stack: PostgreSQL, Redis, MinIO (S3-compatible evidence storage), the web app and the workers.
#   cp .env.example .env   # then fill in SESSION_SECRET, ADMIN_*, S3_* (see ENVIRONMENT.md)
#   docker compose up --build
# Nothing here contains a real secret; every credential comes from .env.

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:5310}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  DATABASE_URL: postgres://${POSTGRES_USER:-dealer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/dealer_intel
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-dealer-intel-evidence}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  S3_FORCE_PATH_STYLE: "true"
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dealer_intel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealer} -d dealer_intel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    # AOF so delayed response-check jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]

  migrate:
    build: { context: ., target: web }
    command: ["sh", "-c", "npx tsx src/db/migrate.ts && npx tsx src/db/seed.ts"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    environment: *app-env
    ports: ["5310:5310"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  worker:
    build: { context: ., target: worker }
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
